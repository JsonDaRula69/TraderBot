name: Auto-merge (jsondarula)

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [v1-main]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: github.actor == 'jsondarula' && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      - name: Enable auto-merge (squash)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr merge "${{ github.event.pull_request.html_url }}" \
            --auto --squash \
            --body "Auto-merged by jsondarula auto-merge workflow"