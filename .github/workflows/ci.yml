name: CI

on:
  push:
    branches: [v2-main]
  pull_request:
    branches: [v2-main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v5
      - run: uvx --with ruff ruff check src/ tests/
      - run: uvx --with ruff ruff format src/traderbot --check

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-extras --dev
      # The injection publication guard rejects group-writable workspace
      # ancestors (sticky does not exempt), so real-CLI deploy E2Es cannot
      # pass under the default /tmp basetemp on POSIX runners.
      - run: uv run pytest tests/ -v --tb=short --basetemp="$HOME/pytest-tmp"

  security:
    name: Dependency security audit
    runs-on: ubuntu-latest
    env:
      CHROMADB_WAIVER_OWNER: TraderBot
      CHROMADB_WAIVER_REMOVAL: "first official patched release containing upstream fix #7237"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen --all-extras --dev
      - run: uv export --frozen --no-hashes --no-emit-project -o requirements-audit.txt
      # chromadb 1.5.9 is the newest published release on PyPI and the last
      # affected version of PYSEC-2026-3813/3814/3815 (GHSAs 2wm9-hf6c-p5cr /
      # 36p7-vc44-83pf / xph7-9rjv-w5fr, CVE-2026-45830 / 45833 / 45831); OSV
      # reports no fixed version for any of the three. Each is reachable only
      # through chromadb's HTTP/FastAPI server, its SimpleRBAC authorization
      # provider, or a CloudClient — paths TraderBot's embedded-only design
      # forbids and actively guards (settings assertion in
      # src/traderbot/db/security.py, AST import guard in
      # tests/test_chroma_security.py). Same accepted-risk rationale as
      # GHSA-f4j7-r4q5-qw2c (#196); waived under the same
      # CHROMADB_WAIVER_OWNER / CHROMADB_WAIVER_REMOVAL governance.
      - run: |-
          uvx pip-audit --strict --aliases -r requirements-audit.txt \
            --ignore-vuln GHSA-f4j7-r4q5-qw2c \
            --ignore-vuln PYSEC-2026-3813 \
            --ignore-vuln PYSEC-2026-3814 \
            --ignore-vuln PYSEC-2026-3815

  build:
    name: Build wheel
    runs-on: ubuntu-latest
    needs: [lint, test, security]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v5
      - run: uv build
      - run: pip install dist/*.whl && python -c "import traderbot; print('import OK')"
      - name: Entry point smoke test
        # Starts the real server (__main__ guard) with closed stdin; the
        # server must initialize and exit cleanly (or timeout = failure).
        run: timeout 15 python -m traderbot.mcp.server </dev/null
      - name: Console script registered
        run: python -c "from importlib.metadata import entry_points; eps=[e.name for e in entry_points(group='console_scripts')]; assert 'traderbot-mcp-server' in eps, f'missing, got {eps}'; print('console script OK')"
