name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**.md"
      - "CHANGELOG.md"
      - "LICENSE"
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"  # every Monday 06:00 UTC — full matrix + live tests

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frozen-check:
    name: Frozen lockfile check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Check lockfile is fresh
        run: uv sync --frozen

  lint:
    name: Lint & format
    needs: frozen-check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Lint with ruff
        run: uvx --with ruff ruff check src/ --exit-zero

      - name: Check formatting with ruff
        run: uvx --with ruff ruff format src/traderbot --check

  unit:
    name: Unit tests
    needs: lint
    runs-on: ubuntu-latest

  frozen-check:
    name: Frozen lockfile check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Check lockfile is fresh
        run: uv sync --frozen

  lint:
    name: Lint & format
    needs: frozen-check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Lint with ruff
        run: uvx --with ruff ruff check src/ --exit-zero

      - name: Check formatting with ruff
        run: uvx --with ruff ruff format src/traderbot --check

  unit:
    name: Unit tests
    needs: lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --dev

      - name: Run unit tests
        run: uv run --frozen pytest -m "unit" --cov=src/traderbot --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v5
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  test:
    name: Test (${{ matrix.os }})
    needs: unit
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Run tests (not live)
        run: .venv/bin/python -m pytest -m "not live" --cov=src/traderbot --cov-report=xml

      - name: Upload coverage to Codecov (Linux only)
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v5
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  live:
    name: Live API tests
    needs: unit
    # Run on push to main and weekly schedule — NOT on PR (fork PRs lack secrets)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Run live tests
        run: .venv/bin/python -m pytest -m "live" --timeout=60 -x
        env:
          KALSHI_API_KEY: ${{ secrets.KALSHI_API_KEY }}
          KALSHI_PRIVATE_KEY_PEM: ${{ secrets.KALSHI_PRIVATE_KEY_PEM }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
          NEWSAPI_API_KEY: ${{ secrets.NEWSAPI_API_KEY }}
          VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
        continue-on-error: true

  build:
    name: Build wheel
    needs: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Build
        run: uv build

      - name: Verify pip install
        run: |
          WHEEL=$(ls dist/traderbot-*-py3-none-any.whl)
          uv tool install --reinstall "$WHEEL"
          uvx traderbot --version