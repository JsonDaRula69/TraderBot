[build-system]
requires = ["hatchling>=1.31.0"]
build-backend = "hatchling.build"

[project]
name = "traderbot"
dynamic = ["version"]
description = "Autonomous prediction market trading toolkit for OpenClaw agents (MCP-based v2)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.14"
dependencies = [
    "chromadb==1.5.9",
    "cryptography>=50.0.1",
    "httpx>=0.27.0",
    "infisicalsdk>=1.0.16",
    "mcp>=2.0.0",
    "onnxruntime==1.23.2",
    "pydantic>=2.13.4",
    "uvicorn>=0.34.0",
    "websockets>=13.0",
]

[project.scripts]
traderbot-mcp-server = "traderbot.mcp.server:run_server"
traderbot-daemon = "traderbot.daemon:main"
traderbot = "traderbot.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/traderbot"]

[tool.hatch.version]
path = "VERSION"
# Bare-version file (no `__version__ = "..."` assignment): capture the whole line.
pattern = "(?P<version>.+)"

[dependency-groups]
dev = [
    "basedpyright>=1.28.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.uv]
required-environments = [
    "sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'linux' and platform_machine == 'aarch64'",
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "PIE", "PYI", "UP"]

[tool.pytest.ini_options]
markers = [
    "e2e: end-to-end tests that validate the full MCP transport chain",
]

[tool.basedpyright]
venvPath = "."
venv = ".venv"
failOnWarnings = false
