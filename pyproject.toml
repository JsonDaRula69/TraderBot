[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "traderbot"
dynamic = ["version"]
description = "Autonomous prediction market investment toolkit for Kalshi"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12,<3.13"
keywords = ["kalshi", "prediction-markets", "trading", "ai-agent"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "httpx>=0.27",
    "websockets>=13.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "typer>=0.12",
    "rich>=13.0",
    "feedparser>=6.0",
    "vaderSentiment>=3.3",
    "textblob>=0.18",
    "chromadb>=0.5.0,<2.0.0",
    "voyageai>=0.2,<1.0",
    "packaging>=24.0",
    "cryptography>=42.0",
    "portalocker>=2.8",
    "keyring>=25.0",
    "scipy>=1.13",
    "mcp>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/JsonDaRula69/TraderBot"
Repository = "https://github.com/JsonDaRula69/TraderBot"
"Bug Tracker" = "https://github.com/JsonDaRula69/TraderBot/issues"

[tool.hatch.version]
path = "VERSION"
pattern = "(?P<version>\\d+\\.\\d+\\.\\d+)"

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]
news-extras = ["pytrends>=4.9.2"]
sentry = ["sentry-sdk>=2.0.0"]

[project.scripts]
traderbot = "traderbot.cli:main"
traderbot-mcp-server = "traderbot.mcp.server:run_server"

[tool.hatch.build.targets.wheel]
packages = ["src/traderbot"]
exclude = ["tests", "experiments", "experiment/tests"]

[tool.hatch.build.targets.sdist]
exclude = ["tests", "experiments", "experiment/tests", ".github", ".openclaw"]

[tool.uv]
constraint-dependencies = ["onnxruntime<1.24"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src"]
exclude = ["experiments", "install", ".openclaw", "docs", "skills", "src/traderbot/experiment/tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking
    "RUF",  # ruff-specific
]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"src/traderbot/analysis/*.py" = ["E402"]
"src/traderbot/risk/*.py" = ["E402"]
"src/traderbot/cli/*.py" = ["E402"]
"src/traderbot/kalshi/*.py" = ["E402"]
"src/traderbot/db/*.py" = ["E402"]
"src/traderbot/profiles/*.py" = ["E402"]
"src/traderbot/news/*.py" = ["E402"]
"src/traderbot/data/*.py" = ["E402"]
"src/traderbot/experiment/*.py" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["traderbot"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short"
markers = [
    "unit: unit tests (no external dependencies)",
    "integration: integration tests (mocked external services)",
    "live: live integration tests (real API calls, skip on missing keys)",
    "slow: slow tests (skipped in fast runs)",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-timeout>=2.3",
    "respx>=0.23.1",
]
