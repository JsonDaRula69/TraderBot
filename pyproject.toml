[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "traderbot"
dynamic = ["version"]
description = "Autonomous prediction market trading toolkit for OpenClaw agents (MCP-based v2)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "cryptography>=50.0.0",
    "infisicalsdk>=1.0.16",
    "mcp>=2.0.0",
    "pydantic>=2.13.4",
]

[project.scripts]
traderbot-mcp-server = "traderbot.mcp.server:run_server"

[tool.hatch.build.targets.wheel]
packages = ["src/traderbot"]

[tool.hatch.version]
path = "VERSION"
# Bare-version file (no `__version__ = "..."` assignment): capture the whole line.
pattern = "(?P<version>.+)"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "PIE", "PYI", "UP"]

[tool.pytest.ini_options]
markers = [
    "e2e: end-to-end tests that validate the full MCP transport chain",
]

[tool.basedpyright]
venvPath = "."
venv = ".venv"
