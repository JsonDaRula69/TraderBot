[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "traderbot"
version = "0.10.17""
description = "Autonomous prediction market investment toolkit for Kalshi"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.27",
    "websockets>=13.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "typer>=0.12",
    "rich>=13.0",
    "keyring>=25.0",
    "feedparser>=6.0",
    "vaderSentiment>=3.3",
    "textblob>=0.18",
    "chromadb>=0.5.0,<1.0.0",
    "voyageai>=0.2,<1.0",
    "packaging>=24.0",
    "cryptography>=42.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "respx>=0.22",
]

[project.scripts]
traderbot = "traderbot.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/traderbot"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking
    "RUF",  # ruff-specific
]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["traderbot"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short"
markers = [
    "unit: unit tests (no external dependencies)",
    "integration: integration tests (mocked external services)",
    "slow: slow tests (skipped in fast runs)",
]